! Cisco IOS Startup Configuration for Backup Core Router R3
! NETSIMX — Intelligent Network Design Platform
! Device: R3 (Cisco 2911 ISR)
! Role: Secondary Core Router (Backup Alternate Path)

version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
! Interface Configuration
interface GigabitEthernet0/1
 description Backup Core Transit Link from R1
 ip address 10.0.2.2 255.255.255.252
 ip ospf cost 4
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 description Backup Core Transit Link to R4
 ip address 10.0.4.1 255.255.255.252
 ip ospf cost 4
 duplex auto
 speed auto
 no shutdown
!
! Dynamic Routing Configuration (OSPF Area 0)
router ospf 1
 router-id 3.3.3.3
 network 10.0.2.0 0.0.0.3 area 0
 network 10.0.4.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
