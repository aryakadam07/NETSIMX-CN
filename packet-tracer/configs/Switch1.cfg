! Cisco IOS Startup Configuration for Access Switch Switch-LAN
! NETSIMX — Intelligent Network Design Platform
! Device: Switch-LAN (Cisco Catalyst 2960 Layer 2 Switch)
! Role: Workstation LAN Aggregation Switch

version 15.0
no service password-encryption
!
hostname Switch-LAN
!
! VLAN Definition
vlan 10
 name WORKSTATIONS
!
! Port Allocation & Security
interface FastEthernet0/1
 description Access Port - Workstation PC1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/2
 description Access Port - Workstation PC2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/24
 description Trunk / Uplink Port to Edge Router R1
 switchport mode access
 switchport access vlan 10
!
! Management Interface Configuration
interface Vlan1
 description Switch Management Interface
 ip address 192.168.1.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.1.1
!
line con 0
line vty 0 4
 login
!
end
