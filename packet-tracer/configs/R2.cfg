! Cisco IOS Startup Configuration for Core Router R2
! NETSIMX — Intelligent Network Design Platform
! Device: R2 (Cisco 2911 ISR)
! Role: Primary Core Router (Low Cost Path)

version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
! Interface Configuration
interface GigabitEthernet0/1
 description Primary Core Transit Link from R1
 ip address 10.0.1.2 255.255.255.252
 ip ospf cost 2
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 description Primary Core Transit Link to R4
 ip address 10.0.3.1 255.255.255.252
 ip ospf cost 2
 duplex auto
 speed auto
 no shutdown
!
! Dynamic Routing Configuration (OSPF Area 0)
router ospf 1
 router-id 2.2.2.2
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.3.0 0.0.0.3 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
