! Cisco IOS Startup Configuration for Edge Router R1
! NETSIMX — Intelligent Network Design Platform
! Device: R1 (Cisco 2911 ISR)
! Role: Edge Router, Workstation Gateway & DHCP Server

version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
! DHCP Pool Configuration for Workstation LAN
ip dhcp excluded-address 192.168.1.1 192.168.1.49
ip dhcp pool LAN_WORKSTATIONS
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.1
 dns-server 172.16.1.10
 domain-name netsimx.local
 lease 1 0 0
!
! Interface Configuration
interface GigabitEthernet0/0
 description Connected to Switch-LAN (Workstation Subnet)
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Primary Core Transit Link to R2
 ip address 10.0.1.1 255.255.255.252
 ip ospf cost 2
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 description Backup Core Transit Link to R3
 ip address 10.0.2.1 255.255.255.252
 ip ospf cost 4
 duplex auto
 speed auto
 no shutdown
!
! Dynamic Routing Configuration (OSPF Area 0)
router ospf 1
 router-id 1.1.1.1
 network 192.168.1.0 0.0.0.255 area 0
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.2.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
