! Cisco IOS Startup Configuration for Gateway Router R4
! NETSIMX — Intelligent Network Design Platform
! Device: R4 (Cisco 2911 ISR)
! Role: DMZ Gateway Router & OSPF Egress Node

version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
! Interface Configuration
interface GigabitEthernet0/0
 description Connected to Switch-DMZ (Server Subnet)
 ip address 172.16.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Primary Core Transit Link from R2
 ip address 10.0.3.2 255.255.255.252
 ip ospf cost 2
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 description Backup Core Transit Link from R3
 ip address 10.0.4.2 255.255.255.252
 ip ospf cost 4
 duplex auto
 speed auto
 no shutdown
!
! Dynamic Routing Configuration (OSPF Area 0)
router ospf 1
 router-id 4.4.4.4
 network 172.16.1.0 0.0.0.255 area 0
 network 10.0.3.0 0.0.0.3 area 0
 network 10.0.4.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
