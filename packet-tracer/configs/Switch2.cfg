! Cisco IOS Startup Configuration for DMZ Switch Switch-DMZ
! NETSIMX — Intelligent Network Design Platform
! Device: Switch-DMZ (Cisco Catalyst 2960 Layer 2 Switch)
! Role: DMZ Server Aggregation Switch

version 15.0
no service password-encryption
!
hostname Switch-DMZ
!
! VLAN Definition
vlan 20
 name SERVERS
!
! Port Allocation & Security
interface FastEthernet0/1
 description Access Port - Web Server Server1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/2
 description Access Port - DNS Server
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/24
 description Trunk / Uplink Port to Gateway Router R4
 switchport mode access
 switchport access vlan 20
!
! Management Interface Configuration
interface Vlan1
 description Switch Management Interface
 ip address 172.16.1.2 255.255.255.0
 no shutdown
!
ip default-gateway 172.16.1.1
!
line con 0
line vty 0 4
 login
!
end
